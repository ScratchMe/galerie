name: Publier la galerie
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_run:
    workflows: ["Importer depuis Adobe Portfolio"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Mettre en ligne (branche gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: antoine.berthaud.me
          user_name: "Claude (pour Antoine)"
          user_email: "478204+ScratchMe@users.noreply.github.com"
